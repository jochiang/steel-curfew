<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101217" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Mech Arena</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div class="hud-left">
        <div class="hp bar"><i></i><span></span></div>
        <div class="salvage"><b>◆</b> <span></span></div>
      </div>
      <div class="hud-mid">
        <div class="wave"></div>
        <div class="timer"></div>
      </div>
      <button class="pause" aria-label="Pause"><i></i><i></i></button>
      <div class="boss" hidden><span></span><div class="bar"><i></i></div></div>
    </div>

    <section id="title" class="screen" hidden></section>
    <section id="hangar" class="screen" hidden></section>
    <section id="paused" class="screen" hidden></section>
    <section id="end" class="screen" hidden></section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
